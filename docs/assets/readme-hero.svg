<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Crabbox</title>
  <desc id="desc">Warm a box, sync the diff, run the suite. A coral crab sits inside a box between a working-tree diff and a completed run.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#09121f"/>
      <stop offset="1" stop-color="#111c2d"/>
    </linearGradient>
    <linearGradient id="box" x2="0" y2="1">
      <stop stop-color="#ff9a86"/>
      <stop offset="1" stop-color="#ee6955"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#a5c7df" stroke-opacity=".045"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect x="480" width="720" height="320" rx="24" fill="url(#grid)"/>
  <path d="M48 46h40" stroke="#ff927d" stroke-width="4" stroke-linecap="round"/>
