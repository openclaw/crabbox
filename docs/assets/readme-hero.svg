    <text x="51" y="187" fill="#c1cedd" font-size="25">Warm a box, sync the diff,</text>
    <text x="51" y="220" fill="#c1cedd" font-size="25">run the suite.</text>
    <text x="51" y="279" fill="#8d9fb4" font-size="15" letter-spacing="3">LOCAL EDITS. REMOTE EXECUTION.</text>
  </g>
