[package]
name = "crabbox-wasmtime-meter"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.0"
license = "MIT"
publish = false
description = "Source-built experimental fuel evidence for Crabbox's workflow policy tests"

[features]
default = []
fixture = []

[dependencies]
anyhow = "=1.0.103"
libc = "0.2"
serde_json = "=1.0.145"
sha2 = "=0.10.9"
time = { version = "=0.3.44", features = ["formatting"] }
wasmtime = { version = "=50.0.1", default-features = false, features = ["anyhow", "cranelift", "runtime", "std"] }
wasmtime-wasi = { version = "=50.0.1", default-features = false, features = ["p1"] }

[dev-dependencies]
wat = "=1.240.0"

[[bin]]
name = "fixture-child"
path = "src/fixture_child.rs"
required-features = ["fixture"]

[profile.release]
strip = "debuginfo"

[workspace]
