name: Publish AWS Image Candidate
run-name: Publish ${{ inputs.target }} AWS image candidate in ${{ inputs.region }}

on:
  workflow_dispatch:
    inputs:
      target:
        description: Candidate image platform
        required: true
        type: choice
        options:
          - linux
          - windows
      region:
        description: AWS region
        required: true
        default: eu-west-1
        type: string
      base_image:
        description: Exact source AMI id
        required: true
        type: string
      previous_default:
        description: Previous default AMI id recorded for rollback evidence
        required: false
        type: string
      architecture:
        description: Source and candidate architecture
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - arm64
      linux_type:
        description: Linux source instance type
        required: true
        default: m7i.large
        type: string
      windows_type:
        description: Windows source instance type
        required: true
        default: m7i.large
        type: string

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: devtools-image-candidate-${{ inputs.target }}-${{ inputs.region }}
  cancel-in-progress: false

jobs:
  guard:
    name: Guard protected candidate publication
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the protected default-branch workflow
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/devtools-image-publish.yml@$expected_ref"
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == "$expected_ref" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$expected_workflow_ref" ]]
          [[ "$REF_PROTECTED" == true ]]
          [[ "$WORKFLOW_SHA" == "$RUN_SHA" ]]

      - name: Validate candidate inputs
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
          REGION: ${{ inputs.region }}
          BASE_IMAGE: ${{ inputs.base_image }}
          PREVIOUS_DEFAULT: ${{ inputs.previous_default }}
          ARCHITECTURE: ${{ inputs.architecture }}
          LINUX_TYPE: ${{ inputs.linux_type }}
          WINDOWS_TYPE: ${{ inputs.windows_type }}
        run: |
          set -euo pipefail
          [[ "$TARGET" =~ ^(linux|windows)$ ]]
          [[ "$REGION" =~ ^[a-z]{2}(-gov)?-[a-z]+-[0-9]+$ ]]
          [[ "$BASE_IMAGE" =~ ^ami-[0-9a-z]+$ ]]
          [[ -z "$PREVIOUS_DEFAULT" || "$PREVIOUS_DEFAULT" =~ ^ami-[0-9a-z]+$ ]]
          [[ "$ARCHITECTURE" =~ ^(x86_64|arm64)$ ]]
          [[ "$LINUX_TYPE" =~ ^[A-Za-z0-9.-]+$ ]]
          [[ "$WINDOWS_TYPE" =~ ^[A-Za-z0-9.-]+$ ]]

  publish:
    name: Build, smoke, and publish candidate evidence
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: image-publisher
    env:
      CRABBOX_COORDINATOR: ${{ vars.CRABBOX_COORDINATOR }}
      CRABBOX_COORDINATOR_TOKEN: ${{ secrets.CRABBOX_COORDINATOR_ADMIN_TOKEN }}
      CRABBOX_COORDINATOR_ADMIN_TOKEN: ${{ secrets.CRABBOX_COORDINATOR_ADMIN_TOKEN }}
      CRABBOX_OWNER: ${{ vars.CRABBOX_IMAGE_PUBLISHER_OWNER }}
      CRABBOX_ORG: ${{ vars.CRABBOX_IMAGE_PUBLISHER_ORG }}
      CRABBOX_ACCESS_CLIENT_ID: ${{ secrets.CRABBOX_ACCESS_CLIENT_ID }}
      CRABBOX_ACCESS_CLIENT_SECRET: ${{ secrets.CRABBOX_ACCESS_CLIENT_SECRET }}
      TARGET: ${{ inputs.target }}
      REGION: ${{ inputs.region }}
      BASE_IMAGE: ${{ inputs.base_image }}
      PREVIOUS_DEFAULT: ${{ inputs.previous_default }}
      ARCHITECTURE: ${{ inputs.architecture }}
      LINUX_TYPE: ${{ inputs.linux_type }}
      WINDOWS_TYPE: ${{ inputs.windows_type }}
    steps:
      - name: Verify publisher configuration
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$CRABBOX_COORDINATOR" ]]; then
            echo "::error::Set the CRABBOX_COORDINATOR variable on the image-publisher environment."
            exit 1
          fi
          if [[ -z "$CRABBOX_COORDINATOR_ADMIN_TOKEN" ]]; then
            echo "::error::Set the CRABBOX_COORDINATOR_ADMIN_TOKEN secret on the image-publisher environment."
            exit 1
          fi
          if (( ${#CRABBOX_OWNER} > 254 )) ||
            [[ ! "$CRABBOX_OWNER" =~ ^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+[.][A-Za-z]+$ ]] ||
            [[ "$CRABBOX_OWNER" =~ [.](invalid|example|test|localhost)$ ]]; then
            echo "::error::Set CRABBOX_IMAGE_PUBLISHER_OWNER to a valid email on the image-publisher environment."
            exit 1
          fi
          if (( ${#CRABBOX_ORG} > 63 )) ||
            [[ ! "$CRABBOX_ORG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]; then
            echo "::error::Set CRABBOX_IMAGE_PUBLISHER_ORG to a valid tenant on the image-publisher environment."
            exit 1
          fi

      - name: Check out protected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build trusted tools
        shell: bash
        run: |
          set -euo pipefail
          go build -trimpath -o bin/crabbox ./cmd/crabbox
          GOBIN="$RUNNER_TEMP/image-tools" go install oras.land/oras/cmd/oras@v1.3.3
          GOBIN="$RUNNER_TEMP/image-tools" go install github.com/sigstore/cosign/v2/cmd/cosign@v2.6.5
          echo "$RUNNER_TEMP/image-tools" >>"$GITHUB_PATH"

      - name: Authenticate to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" |
            "$RUNNER_TEMP/image-tools/oras" login ghcr.io \
              --username "$GITHUB_ACTOR" \
              --password-stdin

      - name: Build and prove candidate
        shell: bash
        env:
          CRABBOX_IMAGE_LOG_DIR: ${{ runner.temp }}/devtools-image-proof/aws
          CRABBOX_IMAGE_CANDIDATE_OUTPUT: ${{ runner.temp }}/devtools-image-proof/candidate
          CRABBOX_IMAGE_BASE_IMAGE: ${{ inputs.base_image }}
          CRABBOX_IMAGE_ARCHITECTURE: ${{ inputs.architecture }}
          CRABBOX_IMAGE_SOURCE_REPOSITORY: ${{ github.repository }}
          CRABBOX_IMAGE_SOURCE_COMMIT: ${{ github.sha }}
          CRABBOX_IMAGE_WORKFLOW_REF: ${{ github.workflow_ref }}
          CRABBOX_IMAGE_WORKFLOW_RUN_ID: ${{ github.run_id }}
          CRABBOX_IMAGE_WORKFLOW_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/devtools-image-proof"
          mkdir -p "$proof_dir"
          if [[ "$TARGET" == linux ]]; then
            instance_type="$LINUX_TYPE"
          else
            instance_type="$WINDOWS_TYPE"
          fi
          command=(
            scripts/mint-aws-devtools-image.sh
            --target "$TARGET"
            --region "$REGION"
            --class standard
            --type "$instance_type"
            --architecture "$ARCHITECTURE"
            --base-image "$BASE_IMAGE"
            --candidate-output "$CRABBOX_IMAGE_CANDIDATE_OUTPUT"
            --recipe "recipes/aws/v1/$TARGET-devtools.json"
            --run
            --no-promote
          )
          if [[ "$TARGET" == windows ]]; then
            command+=(--windows-mode normal)
          fi
          if [[ -n "$PREVIOUS_DEFAULT" ]]; then
            command+=(--previous-default "$PREVIOUS_DEFAULT")
          fi
          printf 'Candidate source commit: %s\n' "$GITHUB_SHA"
          printf 'Command:'
          printf ' %q' "${command[@]}"
          printf '\n'
          "${command[@]}" 2>&1 | tee "$proof_dir/candidate.log"
          node scripts/aws-image-candidate.mjs verify \
            --dir "$CRABBOX_IMAGE_CANDIDATE_OUTPUT" |
            tee "$proof_dir/verification.json"

      - name: Publish and sign immutable OCI evidence
        shell: bash
        run: |
          set -euo pipefail
          proof_dir="$RUNNER_TEMP/devtools-image-proof"
          repository="ghcr.io/${GITHUB_REPOSITORY,,}-aws-image-candidates"
          scripts/publish-aws-image-candidate.sh \
            --bundle "$proof_dir/candidate" \
            --repository "$repository" \
            --certificate-identity "https://github.com/$GITHUB_WORKFLOW_REF" |
            tee "$proof_dir/publication.json"

      - name: Summarize candidate publication
        if: always()
        shell: bash
        run: |
          {
            echo "## AWS image candidate"
            echo
            echo "- Target: \`$TARGET\`"
            echo "- Region: \`$REGION\`"
            echo "- Source commit: \`$GITHUB_SHA\`"
            if [[ -f "$RUNNER_TEMP/devtools-image-proof/publication.json" ]]; then
              # JavaScript template expressions are evaluated by Node.
              # shellcheck disable=SC2016
              node -e '
                const fs = require("fs");
                const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
                console.log(`- OCI evidence: \`${value.immutableRef}\``);
                console.log(`- Candidate digest: \`${value.candidateDigest}\``);
              ' "$RUNNER_TEMP/devtools-image-proof/publication.json"
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Upload candidate proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aws-image-candidate-${{ inputs.target }}-${{ github.run_id }}
          path: ${{ runner.temp }}/devtools-image-proof
          if-no-files-found: error
          retention-days: 30
