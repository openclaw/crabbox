name: Verify Image Publisher Auth

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-publisher-auth-check
  cancel-in-progress: false

jobs:
  guard:
    name: Guard protected verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require the protected default-branch workflow
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_PROTECTED: ${{ github.ref_protected }}
          RUN_SHA: ${{ github.sha }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          set -euo pipefail
          expected_ref="refs/heads/$DEFAULT_BRANCH"
          expected_workflow_ref="$GITHUB_REPOSITORY/.github/workflows/image-publisher-auth-check.yml@$expected_ref"
          [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]
          [[ "$GITHUB_REF" == "$expected_ref" ]]
          [[ "$GITHUB_WORKFLOW_REF" == "$expected_workflow_ref" ]]
          [[ "$REF_PROTECTED" == true ]]
          [[ "$WORKFLOW_SHA" == "$RUN_SHA" ]]

  verify:
    name: Verify existing publisher admin access
    needs: guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: image-publisher
    steps:
      - name: Check out protected source
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Check admin access without publishing
        env:
          CRABBOX_COORDINATOR: ${{ vars.CRABBOX_COORDINATOR }}
          CRABBOX_COORDINATOR_ADMIN_TOKEN: ${{ secrets.CRABBOX_COORDINATOR_ADMIN_TOKEN }}
          CRABBOX_ACCESS_CLIENT_ID: ${{ secrets.CRABBOX_ACCESS_CLIENT_ID }}
          CRABBOX_ACCESS_CLIENT_SECRET: ${{ secrets.CRABBOX_ACCESS_CLIENT_SECRET }}
          NODE_DEBUG: ""
          NODE_OPTIONS: ""
        run: node scripts/image-publisher-auth-check.mjs
