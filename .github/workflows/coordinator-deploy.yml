name: Deploy Coordinator

# Deploys the crabbox-coordinator Worker when runtime or deployment inputs land
# on main, so production tracks main without redeploying for test-only changes.
# Also runnable on demand from the Actions tab.
on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - "!worker/test/**"
      - ".github/workflows/coordinator-deploy.yml"
      - "scripts/prepare-coordinator-deploy-secrets.mjs"
      - "scripts/verify-coordinator-deployment.mjs"
      - "scripts/verify-coordinator-lease-policy.mjs"
      - "scripts/deploy-coordinator.mjs"
  workflow_dispatch:
    inputs:
      replace_live_lease_policy:
        description: Acknowledge the reviewed complete replacement document ({} removes exceptions)
        required: false
        default: false
        type: boolean
      lease_policy_replacement:
        description: Complete reviewed override JSON; required only for intentional replacement/removal
        required: false
        default: ""
        type: string
      lease_policy_expected_sha256:
        description: Reviewed live policy SHA-256 from the read-only --snapshot guard command
        required: false
        default: ""
        type: string
      clearDaytonaSnapshot:
        description: Clear the Worker snapshot binding after removing the coordinator environment secret
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: coordinator-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy crabbox-coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scope the Cloudflare token to this environment; add required reviewers here
    # to gate production deploys without changing the workflow.
    environment: coordinator
    steps:
      - name: Check for deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it to the 'coordinator' environment before deploying."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci
        working-directory: worker

      - name: Deploy
        id: deploy
        # The helper guards the exact transient Wrangler config, checks drift,
        # verifies the uploaded version and policy, and removes private files.
        run: |
          set -euo pipefail

          SECRETS_FILE="$(mktemp "${RUNNER_TEMP}/crabbox-coordinator-secrets.XXXXXX")"
          export SECRETS_FILE
          trap 'rm -f "${SECRETS_FILE}"' EXIT
          node ../scripts/prepare-coordinator-deploy-secrets.mjs

          if [ -s "${SECRETS_FILE}" ]; then
            node ../scripts/deploy-coordinator.mjs --secrets-file "${SECRETS_FILE}"
          else
            node ../scripts/deploy-coordinator.mjs
          fi

          if [ "${CLEAR_DAYTONA_SNAPSHOT}" = "true" ]; then
            printf '{"CRABBOX_DAYTONA_SNAPSHOT":null}\n' |
              npx wrangler secret bulk
          fi
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # OpenClaw account that hosts crabbox.openclaw.ai; not secret. The
          # worker's wrangler.jsonc omits account_id so local deploys stay
          # account-agnostic, so CI supplies it explicitly.
          CLOUDFLARE_ACCOUNT_ID: "91b59577e757131d68d55a471fe32aca"
          CRABBOX_DAYTONA_SNAPSHOT: ${{ secrets.CRABBOX_DAYTONA_SNAPSHOT }}
          CRABBOX_ARTIFACTS_CREDENTIALS_JSON: ${{ secrets.CRABBOX_ARTIFACTS_CREDENTIALS_JSON }}
          CLEAR_DAYTONA_SNAPSHOT: ${{ inputs.clearDaytonaSnapshot }}
          # The helper reads replacement inputs from GITHUB_EVENT_PATH. Never
          # put policy JSON in step env/run text: Actions prints these first.

      - name: Verify deployed coordinator
        run: node scripts/verify-coordinator-deployment.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "91b59577e757131d68d55a471fe32aca"
          CRABBOX_EXPECTED_LEASE_POLICY_SHA256: ${{ steps.deploy.outputs.lease_policy_sha256 }}
