name: Deploy Coordinator

# Deploys the crabbox-coordinator Worker whenever worker/** lands on main, so
# production tracks main instead of drifting behind a manual `wrangler deploy`
# (stale deploys are how a fixed-on-main OOM stayed broken in prod). Also
# runnable on demand from the Actions tab.
on:
  push:
    branches:
      - main
    paths:
      - "worker/**"
      - ".github/workflows/coordinator-deploy.yml"
      - "scripts/prepare-coordinator-deploy-secrets.mjs"
      - "scripts/verify-coordinator-deployment.mjs"
      - "scripts/verify-coordinator-lease-policy.mjs"
  workflow_dispatch:
    inputs:
      replace_live_lease_policy:
        description: Acknowledge replacing the complete live lease policy override document with source
        required: false
        default: false
        type: boolean
      clearDaytonaSnapshot:
        description: Clear the Worker snapshot binding after removing the coordinator environment secret
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: coordinator-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy crabbox-coordinator
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Scope the Cloudflare token to this environment; add required reviewers here
    # to gate production deploys without changing the workflow.
    environment: coordinator
    steps:
      - name: Check for deploy token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN is not set. Add it to the 'coordinator' environment before deploying."
            exit 1
          fi

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install
        run: npm ci
        working-directory: worker

      - name: Verify lease policy preservation
        run: node scripts/verify-coordinator-lease-policy.mjs
        env:
          CRABBOX_ACKNOWLEDGE_LEASE_POLICY_REPLACEMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.replace_live_lease_policy == true && '1' || '0' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "91b59577e757131d68d55a471fe32aca"

      - name: Deploy
        # `npm run deploy` runs the predeploy bundle (vendor-novnc) then
        # `wrangler deploy`; a bundling failure fails the job before publishing.
        run: |
          set -euo pipefail

          SECRETS_FILE="$(mktemp "${RUNNER_TEMP}/crabbox-coordinator-secrets.XXXXXX")"
          export SECRETS_FILE
          trap 'rm -f "${SECRETS_FILE}"' EXIT
          node ../scripts/prepare-coordinator-deploy-secrets.mjs

          if [ -s "${SECRETS_FILE}" ]; then
            npm run deploy -- --tag "${GITHUB_SHA}" --secrets-file "${SECRETS_FILE}"
          else
            npm run deploy -- --tag "${GITHUB_SHA}"
          fi

          if [ "${CLEAR_DAYTONA_SNAPSHOT}" = "true" ]; then
            printf '{"CRABBOX_DAYTONA_SNAPSHOT":null}\n' |
              npx wrangler secret bulk
          fi
        working-directory: worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          # OpenClaw account that hosts crabbox.openclaw.ai; not secret. The
          # worker's wrangler.jsonc omits account_id so local deploys stay
          # account-agnostic, so CI supplies it explicitly.
          CLOUDFLARE_ACCOUNT_ID: "91b59577e757131d68d55a471fe32aca"
          CRABBOX_DAYTONA_SNAPSHOT: ${{ secrets.CRABBOX_DAYTONA_SNAPSHOT }}
          CRABBOX_ARTIFACTS_CREDENTIALS_JSON: ${{ secrets.CRABBOX_ARTIFACTS_CREDENTIALS_JSON }}
          CLEAR_DAYTONA_SNAPSHOT: ${{ inputs.clearDaytonaSnapshot }}

      - name: Verify deployed coordinator
        run: node scripts/verify-coordinator-deployment.mjs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: "91b59577e757131d68d55a471fe32aca"
