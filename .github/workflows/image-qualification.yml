name: Image qualification

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Open same-repository pull request number
        required: true
        type: string
      candidate_sha:
        description: Exact 40-character candidate commit SHA
        required: true
        type: string
      confirm:
        description: Type qualify to authorize one paid attempt
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: image-qualification
  cancel-in-progress: false

env:
  QUALIFICATION_PULL_REQUEST: ${{ inputs.pull_request }}
  QUALIFICATION_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  QUALIFICATION_CONFIRM: ${{ inputs.confirm }}
  QUALIFICATION_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}

jobs:
  authorize:
    name: Authorize exact candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_sha: ${{ steps.authorize.outputs.candidate_sha }}
    steps:
      - name: Check out protected tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Validate protected workflow and open pull request
        id: authorize
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/image-qualification-control.mjs authorize

  build-candidate:
    name: Build candidate without credentials
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      raw_artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Check out exact candidate as source data
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: candidate/go.mod
          cache: false
      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: false
      - name: Build with the protected workflow commands
        env:
          ARTIFACT: ${{ runner.temp }}/image-qualification-candidate
        run: |
          set -euo pipefail
          for name in AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_SESSION_TOKEN CLOUDFLARE_API_TOKEN QUALIFICATION_CONTROLLER_TOKEN; do
            [[ -z "${!name+x}" ]]
          done
          mkdir -p "$ARTIFACT/bin" "$ARTIFACT/worker" "$ARTIFACT/candidate/scripts"
          (cd candidate && go build -trimpath -o "$ARTIFACT/bin/crabbox" ./cmd/crabbox)
          npm ci --prefix candidate/worker --ignore-scripts
          (
            cd candidate/worker
            npm exec --offline -- wrangler deploy --dry-run --outdir "$ARTIFACT/worker" --config wrangler.jsonc
          )
          cp candidate/scripts/mint-aws-devtools-image.sh \
            candidate/scripts/install-linux-developer-tools.sh \
            candidate/scripts/linux-readiness.generated.sh \
            "$ARTIFACT/candidate/scripts/"
          chmod 700 "$ARTIFACT/bin/crabbox" "$ARTIFACT/candidate/scripts/"*.sh
      - name: Upload unsealed candidate bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-qualification-candidate-raw-${{ github.run_id }}
          path: ${{ runner.temp }}/image-qualification-candidate
          if-no-files-found: error
          retention-days: 1

  seal-candidate:
    name: Seal candidate with protected tooling
    needs: [authorize, build-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      candidate_artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      candidate_artifact_id: ${{ steps.upload.outputs.artifact-id }}
      candidate_run_id: ${{ github.run_id }}
    steps:
      - name: Check out protected sealing tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false
      - name: Check out exact candidate identity
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.authorize.outputs.candidate_sha }}
          path: candidate
          persist-credentials: false
      - name: Download unsealed candidate as inert data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-candidate.outputs.raw_artifact_id }}
          path: ${{ runner.temp }}/image-qualification-candidate
      - name: Create immutable manifest with protected tooling
        env:
          QUALIFICATION_CANDIDATE_SHA: ${{ needs.authorize.outputs.candidate_sha }}
          QUALIFICATION_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          node harness/scripts/image-qualification-control.mjs manifest \
            candidate "${{ runner.temp }}/image-qualification-candidate"
      - name: Upload sealed candidate bundle
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-qualification-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/image-qualification-candidate
          if-no-files-found: error
          retention-days: 1

  admit:
    name: Admit rollback-capable candidate
    needs: [authorize, seal-candidate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out protected admission tooling
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download candidate bytes as inert data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.seal-candidate.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/image-qualification-candidate
      - name: Verify manifest and rollback admission contract
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_ARTIFACT_DIR: ${{ runner.temp }}/image-qualification-candidate
          QUALIFICATION_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.seal-candidate.outputs.candidate_artifact_digest }}
          QUALIFICATION_CANDIDATE_ARTIFACT_ID: ${{ needs.seal-candidate.outputs.candidate_artifact_id }}
          QUALIFICATION_CANDIDATE_RUN_ID: ${{ needs.seal-candidate.outputs.candidate_run_id }}
        run: node scripts/image-qualification-control.mjs admit

  deploy-enroll:
    name: Protected deploy and enroll
    needs: [authorize, seal-candidate, admit]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: image-qualification
    outputs:
      run_id: ${{ steps.deploy.outputs.run_id }}
      candidate_sha: ${{ steps.deploy.outputs.candidate_sha }}
      candidate_worker: ${{ steps.deploy.outputs.candidate_worker }}
      candidate_version: ${{ steps.deploy.outputs.candidate_version }}
      relay_worker: ${{ steps.deploy.outputs.relay_worker }}
      relay_version: ${{ steps.deploy.outputs.relay_version }}
      relay_binding_digest: ${{ steps.deploy.outputs.relay_binding_digest }}
      relay_url: ${{ steps.deploy.outputs.relay_url }}
      executor_token: ${{ steps.deploy.outputs.executor_token }}
      deployment_hash: ${{ steps.deploy.outputs.deployment_hash }}
      manifest_sha: ${{ steps.deploy.outputs.manifest_sha }}
      binding_digest: ${{ steps.deploy.outputs.binding_digest }}
      authority_sha: ${{ steps.deploy.outputs.authority_sha }}
      authority_version: ${{ steps.deploy.outputs.authority_version }}
      policy_hash: ${{ steps.deploy.outputs.policy_hash }}
      enrolled_at: ${{ steps.deploy.outputs.enrolled_at }}
      expires_at: ${{ steps.deploy.outputs.expires_at }}
      execution_manifest_digest: ${{ steps.deploy.outputs.execution_manifest_digest }}
      region: ${{ steps.deploy.outputs.region }}
      base_ami_id: ${{ steps.deploy.outputs.base_ami_id }}
    steps:
      - name: Check out protected tooling only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download candidate bytes as inert data
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.seal-candidate.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/image-qualification-candidate
      - name: Revalidate, deploy, read back, and enroll
        id: deploy
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          QUALIFICATION_CONTROLLER_TOKEN: ${{ secrets.CRABBOX_IMAGE_QUALIFICATION_CONTROLLER_TOKEN }}
          QUALIFICATION_AUTHORITY_SHA: ${{ vars.CRABBOX_IMAGE_QUALIFICATION_AUTHORITY_SHA }}
          QUALIFICATION_AUTHORITY_VERSION: ${{ vars.CRABBOX_IMAGE_QUALIFICATION_AUTHORITY_VERSION }}
          QUALIFICATION_EXPECTED_POLICY_HASH: ${{ vars.CRABBOX_IMAGE_QUALIFICATION_POLICY_HASH }}
          QUALIFICATION_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.seal-candidate.outputs.candidate_artifact_digest }}
          QUALIFICATION_CANDIDATE_ARTIFACT_ID: ${{ needs.seal-candidate.outputs.candidate_artifact_id }}
          QUALIFICATION_CANDIDATE_RUN_ID: ${{ needs.seal-candidate.outputs.candidate_run_id }}
          QUALIFICATION_AWS_REGION: ${{ vars.CRABBOX_IMAGE_QUALIFICATION_AWS_REGION }}
          QUALIFICATION_SUBNET_ID: ${{ vars.CRABBOX_IMAGE_QUALIFICATION_SUBNET_ID }}
          QUALIFICATION_SECURITY_GROUP_ID: ${{ vars.CRABBOX_IMAGE_QUALIFICATION_SECURITY_GROUP_ID }}
          QUALIFICATION_BASE_AMI_ID: ${{ vars.CRABBOX_IMAGE_QUALIFICATION_BASE_AMI_ID }}
          QUALIFICATION_ROOT_GB: ${{ vars.CRABBOX_IMAGE_QUALIFICATION_ROOT_GB }}
          QUALIFICATION_ARTIFACT_DIR: ${{ runner.temp }}/image-qualification-candidate
          QUALIFICATION_PROOF_DIR: ${{ runner.temp }}/image-qualification-deploy-proof
        run: node scripts/image-qualification-control.mjs deploy
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-qualification-deploy-${{ github.run_id }}
          path: ${{ runner.temp }}/image-qualification-deploy-proof
          if-no-files-found: warn
          retention-days: 30

  arm:
    name: Protected final deployment admission
    needs: [authorize, seal-candidate, deploy-enroll]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: image-qualification
    steps:
      - name: Check out protected tooling only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Revalidate exact Worker version and arm execution
        id: arm
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          QUALIFICATION_CONTROLLER_TOKEN: ${{ secrets.CRABBOX_IMAGE_QUALIFICATION_CONTROLLER_TOKEN }}
          QUALIFICATION_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.seal-candidate.outputs.candidate_artifact_digest }}
          QUALIFICATION_CANDIDATE_ARTIFACT_ID: ${{ needs.seal-candidate.outputs.candidate_artifact_id }}
          QUALIFICATION_CANDIDATE_RUN_ID: ${{ needs.seal-candidate.outputs.candidate_run_id }}
          QUALIFICATION_EXPECTED_RUN_ID: ${{ needs.deploy-enroll.outputs.run_id }}
          QUALIFICATION_EXPECTED_CANDIDATE_SHA: ${{ needs.deploy-enroll.outputs.candidate_sha }}
          QUALIFICATION_EXPECTED_CANDIDATE_WORKER: ${{ needs.deploy-enroll.outputs.candidate_worker }}
          QUALIFICATION_EXPECTED_CANDIDATE_VERSION: ${{ needs.deploy-enroll.outputs.candidate_version }}
          QUALIFICATION_EXPECTED_RELAY_WORKER: ${{ needs.deploy-enroll.outputs.relay_worker }}
          QUALIFICATION_EXPECTED_RELAY_VERSION: ${{ needs.deploy-enroll.outputs.relay_version }}
          QUALIFICATION_EXPECTED_RELAY_BINDING_DIGEST: ${{ needs.deploy-enroll.outputs.relay_binding_digest }}
          QUALIFICATION_EXPECTED_DEPLOYMENT_HASH: ${{ needs.deploy-enroll.outputs.deployment_hash }}
          QUALIFICATION_EXPECTED_MANIFEST_SHA: ${{ needs.deploy-enroll.outputs.manifest_sha }}
          QUALIFICATION_EXPECTED_BINDING_DIGEST: ${{ needs.deploy-enroll.outputs.binding_digest }}
          QUALIFICATION_EXPECTED_AUTHORITY_SHA: ${{ needs.deploy-enroll.outputs.authority_sha }}
          QUALIFICATION_EXPECTED_AUTHORITY_VERSION: ${{ needs.deploy-enroll.outputs.authority_version }}
          QUALIFICATION_EXPECTED_POLICY_HASH: ${{ needs.deploy-enroll.outputs.policy_hash }}
          QUALIFICATION_EXPECTED_ENROLLED_AT: ${{ needs.deploy-enroll.outputs.enrolled_at }}
          QUALIFICATION_EXPECTED_EXPIRES_AT: ${{ needs.deploy-enroll.outputs.expires_at }}
          QUALIFICATION_EXPECTED_EXECUTION_MANIFEST_DIGEST: ${{ needs.deploy-enroll.outputs.execution_manifest_digest }}
          QUALIFICATION_PROOF_DIR: ${{ runner.temp }}/image-qualification-arm-proof
        run: node scripts/image-qualification-control.mjs arm
      - name: Upload protected execution manifest
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-qualification-arm-${{ github.run_id }}
          path: ${{ runner.temp }}/image-qualification-arm-proof
          if-no-files-found: error
          retention-days: 30

  execute:
    name: Execute candidate without cloud credentials
    needs: [authorize, seal-candidate, deploy-enroll, arm]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Check out protected executor
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          path: harness
          persist-credentials: false
      - name: Download exact candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.seal-candidate.outputs.candidate_artifact_id }}
          path: ${{ runner.temp }}/image-qualification-candidate
      - name: Run publisher rollback qualification
        env:
          QUALIFICATION_RELAY_URL: ${{ needs.deploy-enroll.outputs.relay_url }}
          QUALIFICATION_EXECUTOR_TOKEN: ${{ needs.deploy-enroll.outputs.executor_token }}
          QUALIFICATION_AWS_REGION: ${{ needs.deploy-enroll.outputs.region }}
          QUALIFICATION_BASE_AMI_ID: ${{ needs.deploy-enroll.outputs.base_ami_id }}
          QUALIFICATION_ARTIFACT_DIR: ${{ runner.temp }}/image-qualification-candidate
          QUALIFICATION_PROOF_DIR: ${{ runner.temp }}/image-qualification-execute-proof
        run: |
          set +e
          harness/scripts/image-qualification-execute.sh
          status=$?
          set -e
          [[ "$status" -eq 137 ]]
      - name: Upload sanitized execution evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-qualification-execute-${{ github.run_id }}
          path: ${{ runner.temp }}/image-qualification-execute-proof
          if-no-files-found: warn
          retention-days: 30

  finalize:
    name: Protected finalization and zero-residue proof
    if: always()
    needs: [authorize, deploy-enroll, arm, execute]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: image-qualification
    steps:
      - name: Check out protected tooling only
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download execution evidence as inert data
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: image-qualification-execute-${{ github.run_id }}
          path: ${{ runner.temp }}/image-qualification-execute-proof
      - name: Revalidate identity and finalize idempotently
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          QUALIFICATION_CONTROLLER_TOKEN: ${{ secrets.CRABBOX_IMAGE_QUALIFICATION_CONTROLLER_TOKEN }}
          QUALIFICATION_EXPECTED_RUN_ID: ${{ needs.deploy-enroll.outputs.run_id }}
          QUALIFICATION_EXPECTED_CANDIDATE_SHA: ${{ needs.deploy-enroll.outputs.candidate_sha }}
          QUALIFICATION_EXPECTED_CANDIDATE_WORKER: ${{ needs.deploy-enroll.outputs.candidate_worker }}
          QUALIFICATION_EXPECTED_CANDIDATE_VERSION: ${{ needs.deploy-enroll.outputs.candidate_version }}
          QUALIFICATION_EXPECTED_RELAY_WORKER: ${{ needs.deploy-enroll.outputs.relay_worker }}
          QUALIFICATION_EXPECTED_RELAY_VERSION: ${{ needs.deploy-enroll.outputs.relay_version }}
          QUALIFICATION_EXPECTED_RELAY_BINDING_DIGEST: ${{ needs.deploy-enroll.outputs.relay_binding_digest }}
          QUALIFICATION_EXPECTED_DEPLOYMENT_HASH: ${{ needs.deploy-enroll.outputs.deployment_hash }}
          QUALIFICATION_EXPECTED_MANIFEST_SHA: ${{ needs.deploy-enroll.outputs.manifest_sha }}
          QUALIFICATION_EXPECTED_BINDING_DIGEST: ${{ needs.deploy-enroll.outputs.binding_digest }}
          QUALIFICATION_EXPECTED_AUTHORITY_SHA: ${{ needs.deploy-enroll.outputs.authority_sha }}
          QUALIFICATION_EXPECTED_AUTHORITY_VERSION: ${{ needs.deploy-enroll.outputs.authority_version }}
          QUALIFICATION_EXPECTED_POLICY_HASH: ${{ needs.deploy-enroll.outputs.policy_hash }}
          QUALIFICATION_EXPECTED_ENROLLED_AT: ${{ needs.deploy-enroll.outputs.enrolled_at }}
          QUALIFICATION_EXPECTED_EXPIRES_AT: ${{ needs.deploy-enroll.outputs.expires_at }}
          QUALIFICATION_EXPECTED_EXECUTION_MANIFEST_DIGEST: ${{ needs.deploy-enroll.outputs.execution_manifest_digest }}
          QUALIFICATION_PROOF_DIR: ${{ runner.temp }}/image-qualification-final-proof
          QUALIFICATION_EXECUTION_PROOF_DIR: ${{ runner.temp }}/image-qualification-execute-proof
        run: node scripts/image-qualification-control.mjs finalize
      - name: Upload bounded final evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-qualification-final-${{ github.run_id }}
          path: ${{ runner.temp }}/image-qualification-final-proof
          if-no-files-found: error
          retention-days: 30
