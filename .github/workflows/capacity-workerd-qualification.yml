name: Capacity Workerd Qualification

on:
  push:
    branches: [test/capacity-workerd-qualification-20261022]

permissions:
  contents: read

jobs:
  workerd:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm ci
        working-directory: worker
      - run: node scripts/prove-capacity-workerd.mjs
        working-directory: worker
