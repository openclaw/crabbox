name: Image qualification reaper

on:
  workflow_run:
    workflows: ["Image qualification"]
    types: [completed]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-qualification
  cancel-in-progress: false

jobs:
  reap:
    name: Recover abandoned qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: image-qualification
    steps:
      - name: Check out protected reaper
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Require the protected default-branch workflow
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          expected="$GITHUB_REPOSITORY/.github/workflows/image-qualification-reaper.yml@refs/heads/$DEFAULT_BRANCH"
          [[ "$GITHUB_WORKFLOW_REF" == "$expected" ]]
          [[ "$(git rev-parse HEAD)" == "$GITHUB_WORKFLOW_SHA" ]]
      - name: Discover, finalize, verify, and retire
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          QUALIFICATION_CONTROLLER_TOKEN: ${{ secrets.CRABBOX_IMAGE_QUALIFICATION_CONTROLLER_TOKEN }}
          QUALIFICATION_PROOF_DIR: ${{ runner.temp }}/image-qualification-reaper-proof
        run: node scripts/image-qualification-control.mjs reap
      - name: Upload bounded reaper evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-qualification-reaper-${{ github.run_id }}
          path: ${{ runner.temp }}/image-qualification-reaper-proof
          if-no-files-found: error
          retention-days: 30
