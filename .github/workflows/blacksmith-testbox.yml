name: Blacksmith Testbox
on:
  workflow_dispatch:
    inputs:
      testbox_id:
        type: string
        description: "Testbox session ID"
        required: true

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly -trimpath
  GOTOOLCHAIN: local

jobs:
  go:
    name: Go
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15

    steps:
      - name: Begin Testbox
        # v2
        uses: useblacksmith/begin-testbox@233448af4bfdc6fca509a7f0974411ac6d8a8043
        with:
          testbox_id: ${{ inputs.testbox_id }}

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        # v6
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Expose runtimes to Testbox shell
        shell: bash
        run: |
          set -euo pipefail
          # Bind SSH commands to setup-selected runtimes; they do not inherit the Actions PATH.
          node_bin="$(dirname "$(node -p 'process.execPath')")"
          go_bin="$(go env GOROOT)/bin"
          link_tool() {
            local source="$1"
            local target="/usr/local/bin/$2"
            test -x "$source"
            if [ -e "$target" ] && [ "$(readlink -f "$source")" = "$(readlink -f "$target")" ]; then
              return
            fi
            sudo ln -sf "$source" "$target"
          }
          link_tool "$node_bin/node" node
          link_tool "$node_bin/npm" npm
          link_tool "$node_bin/npx" npx
          link_tool "$go_bin/go" go
          link_tool "$go_bin/gofmt" gofmt

      - name: Run Testbox
        # v2
        uses: useblacksmith/run-testbox@5ca05834db1d3813554d1dd109e5f2087a8d7cbc
        if: success()
