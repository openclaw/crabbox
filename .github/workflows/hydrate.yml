name: Crabbox Hydrate

on:
  workflow_dispatch:
    inputs:
      crabbox_id:
        required: true
        type: string
      crabbox_runner_label:
        required: true
        type: string
      crabbox_job:
        required: false
        default: hydrate
        type: string
      crabbox_keep_alive_minutes:
        required: false
        default: "90"
        type: string

permissions:
  contents: read

jobs:
  hydrate:
    runs-on: [self-hosted, "${{ inputs.crabbox_runner_label }}"]
    timeout-minutes: 20

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
          go-version-file: go.mod

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.22.1

      - name: Install Worker dependencies
        run: npm ci --prefix worker

      - name: Record hydrate state
        shell: bash
        env:
          CRABBOX_ID: ${{ inputs.crabbox_id }}
          CRABBOX_JOB: ${{ inputs.crabbox_job }}
        run: |
          case "$CRABBOX_ID" in
            ""|*[!A-Za-z0-9_-]*)
              echo "::error::crabbox_id must match [A-Za-z0-9_-]+"
              exit 2
              ;;
          esac
          case "$CRABBOX_JOB" in
            *$'\n'*|*$'\r'*)
              echo "::error::crabbox_job must not contain line breaks"
              exit 2
              ;;
          esac
          state_dir="$HOME/.crabbox/actions"
          windows_runner=
          if [ "${RUNNER_OS:-}" = "Windows" ]; then
            # Native Windows Crabbox reads the handoff from ProgramData, which
            # the runner account and the SSH user share.
            windows_runner=1
            program_data="${PROGRAMDATA:-C:\\ProgramData}"
            if command -v cygpath >/dev/null 2>&1; then
              program_data="$(cygpath -u "$program_data")"
            fi
            state_dir="${program_data}/crabbox/actions"
          fi
          # Native Windows Crabbox imports the env file in PowerShell, which takes the
          # text between the outer single quotes verbatim (apostrophes included) and
          # needs Windows paths and a ;-separated PATH. A line break would start a
          # new entry, so refuse one rather than split a value.
          env_line() {
            if [ -n "$windows_runner" ]; then
              case "$2" in
                *$'\n'*|*$'\r'*)
                  echo "::error::$1 contains a line break"
                  exit 2
                  ;;
              esac
              printf "export %s='%s'\n" "$1" "$2"
            else
              printf 'export %s=%q\n' "$1" "$2"
            fi
          }
          path_value() {
            if [ -n "$windows_runner" ] && [ -n "$1" ] && command -v cygpath >/dev/null 2>&1; then
              cygpath -w "$1"
            else
              printf '%s' "$1"
            fi
          }
          path_list_value() {
            if [ -n "$windows_runner" ] && [ -n "$1" ] && command -v cygpath >/dev/null 2>&1; then
              cygpath -w -p "$1"
            else
              printf '%s' "$1"
            fi
          }
          mkdir -p "$state_dir"
          state="${state_dir}/${CRABBOX_ID}.env"
          env_file="${state_dir}/${CRABBOX_ID}.env.sh"
          services_file="${state_dir}/${CRABBOX_ID}.services"
          {
            env_line GITHUB_WORKSPACE "$(path_value "$GITHUB_WORKSPACE")"
            env_line GITHUB_RUN_ID "$GITHUB_RUN_ID"
            env_line GITHUB_JOB "$CRABBOX_JOB"
            env_line RUNNER_TEMP "$(path_value "$RUNNER_TEMP")"
            env_line RUNNER_TOOL_CACHE "$(path_value "$RUNNER_TOOL_CACHE")"
            env_line PATH "$(path_list_value "$PATH")"
          } > "$env_file"
          {
            echo "WORKSPACE=${GITHUB_WORKSPACE}"
            echo "COMMIT=$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
            echo "RUN_ID=${GITHUB_RUN_ID}"
            echo "JOB=${CRABBOX_JOB}"
            echo "ENV_FILE=$(path_value "$env_file")"
            echo "SERVICES_FILE=$(path_value "$services_file")"
            echo "READY_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > "${state}.tmp"
          mv "${state}.tmp" "$state"
